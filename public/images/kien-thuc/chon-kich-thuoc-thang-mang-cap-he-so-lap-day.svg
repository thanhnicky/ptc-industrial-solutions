<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" font-family="Inter, 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif"><title>Chọn kích thước thang máng cáp theo hệ số lấp đầy</title><rect x="0" y="0" width="1200" height="630" rx="0" fill="#fff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="12" height="630" rx="0" fill="#1E4B8F" stroke="none" stroke-width="2"/><text x="60" y="72" font-size="34" font-weight="700" fill="#16202E" text-anchor="start">Chọn kích thước thang máng cáp theo hệ số lấp đầy</text><text x="60" y="108" font-size="19" font-weight="400" fill="#5B6675" text-anchor="start">Công thức nhanh cho máng kín, khay cáp và thang cáp</text><line x1="60" y1="128" x2="1140" y2="128" stroke="#E2E8F0" stroke-width="2"/><path d="M115,300 H100 V480 H520 V300 H505" fill="none" stroke="#1E4B8F" stroke-width="6"/><text x="310" y="282" font-size="16" font-weight="600" fill="#5B6675" text-anchor="middle">Mặt cắt máng / khay cáp</text><circle cx="128" cy="456" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="128" cy="456" r="7" fill="#94A3B8"/><circle cx="172" cy="456" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="172" cy="456" r="7" fill="#94A3B8"/><circle cx="216" cy="456" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="216" cy="456" r="7" fill="#94A3B8"/><circle cx="260" cy="456" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="260" cy="456" r="7" fill="#94A3B8"/><circle cx="304" cy="456" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="304" cy="456" r="7" fill="#94A3B8"/><circle cx="348" cy="456" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="348" cy="456" r="7" fill="#94A3B8"/><circle cx="392" cy="456" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="392" cy="456" r="7" fill="#94A3B8"/><circle cx="436" cy="456" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="436" cy="456" r="7" fill="#94A3B8"/><circle cx="480" cy="456" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="480" cy="456" r="7" fill="#94A3B8"/><circle cx="150" cy="414" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="150" cy="414" r="7" fill="#94A3B8"/><circle cx="194" cy="414" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="194" cy="414" r="7" fill="#94A3B8"/><circle cx="238" cy="414" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="238" cy="414" r="7" fill="#94A3B8"/><circle cx="282" cy="414" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="282" cy="414" r="7" fill="#94A3B8"/><circle cx="326" cy="414" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="326" cy="414" r="7" fill="#94A3B8"/><circle cx="370" cy="414" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="370" cy="414" r="7" fill="#94A3B8"/><circle cx="414" cy="414" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="414" cy="414" r="7" fill="#94A3B8"/><circle cx="458" cy="414" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="458" cy="414" r="7" fill="#94A3B8"/><circle cx="172" cy="372" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="172" cy="372" r="7" fill="#94A3B8"/><circle cx="216" cy="372" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="216" cy="372" r="7" fill="#94A3B8"/><circle cx="260" cy="372" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="260" cy="372" r="7" fill="#94A3B8"/><circle cx="304" cy="372" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="304" cy="372" r="7" fill="#94A3B8"/><circle cx="348" cy="372" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="348" cy="372" r="7" fill="#94A3B8"/><circle cx="392" cy="372" r="20" fill="#CBD5E1" stroke="#475569" stroke-width="2"/><circle cx="392" cy="