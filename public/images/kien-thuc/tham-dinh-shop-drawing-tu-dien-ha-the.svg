" font-weight="400" fill="#5B6675" text-anchor="start">Tỷ số CT theo In, cấp chính xác, đồng hồ</text><circle cx="600" cy="259" r="13" fill="#E8A317"/><text x="600" y="264" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="626" y="265" font-size="18" font-weight="700" fill="#16202E" text-anchor="start">Thanh cái</text><text x="626" y="287" font-size="15" font-weight="400" fill="#5B6675" text-anchor="start">Dòng định mức, Icw (1s) ≥ Ik, tiết diện đồng</text><circle cx="600" cy="309" r="13" fill="#E8A317"/><text x="600" y="314" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="626" y="315" font-size="18" font-weight="700" fill="#16202E" text-anchor="start">Lộ ra MCCB</text><text x="626" y="337" font-size="15" font-weight="400" fill="#5B6675" text-anchor="start">In, Icu, hệ số đồng thời RDF</text><circle cx="600" cy="359" r="13" fill="#E8A317"/><text x="600" y="364" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="626" y="365" font-size="18" font-weight="700" fill="#16202E" text-anchor="start">Thanh N / PE</text><text x="626" y="387" font-size="15" font-weight="400" fill="#5B6675" text-anchor="start">Tiết diện N, PE theo hệ nối đất</text><circle cx="600" cy="409" r="13" fill="#E8A317"/><text x="600" y="414" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="626" y="415" font-size="18" font-weight="700" fill="#16202E" text-anchor="start">Form &amp; cấp IP</text><text x="626" y="437" font-size="15" font-weight="400" fill="#5B6675" text-anchor="start">Form 1–4b, IP theo môi trường đặt tủ</text><circle cx="600" cy="459" r="13" fill="#E8A317"/><text x="600" y="464" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="626" y="465" font-size="18" font-weight="700" fill="#16202E" text-anchor="start">Điều khiển</text><text x="626" y="487" font-size="15" font-weight="400" fill="#5B6675" text-anchor="start">Liên động, ATS, tụ bù, tín hiệu BMS</text><circle cx="600" cy="509" r="13" fill="#E8A317"/><text x="600" y="514" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="626" y="515" font-size="18" font-weight="700" fill="#16202E" text-anchor="start">Đầu cáp vào/ra</text><text x="626" y="537" font-size="15" font-weight="400" fill="#5B6675" text-anchor="start">Hướng cáp, số sợi, tiết diện, đầu cốt</text><text x="1140" y="615" font-size="15" font-weight="600" fill="#1E4B8F" text-anchor="end">tudienptc.vn · PTC Switchboard</text></svg>