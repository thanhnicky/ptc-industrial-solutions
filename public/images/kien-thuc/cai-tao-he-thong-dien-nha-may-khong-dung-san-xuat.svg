<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" font-family="Inter, 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif"><title>Cải tạo điện nhà máy không dừng sản xuất</title><rect x="0" y="0" width="1200" height="630" rx="0" fill="#fff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="12" height="630" rx="0" fill="#1E4B8F" stroke="none" stroke-width="2"/><text x="60" y="72" font-size="34" font-weight="700" fill="#16202E" text-anchor="start">Cải tạo điện nhà máy không dừng sản xuất</text><text x="60" y="108" font-size="19" font-weight="400" fill="#5B6675" text-anchor="start">5 bước và phương án chuyển tải qua tủ mới lắp song song</text><line x1="60" y1="128" x2="1140" y2="128" stroke="#E2E8F0" stroke-width="2"/><polygon points="60,150 250,150 270,195 250,240 60,240" fill="#EEF3FA" stroke="#1E4B8F" stroke-width="2"/><text x="165" y="190" font-size="15" font-weight="700" fill="#1E4B8F" text-anchor="middle">1. Khảo sát,</text><text x="165" y="212" font-size="15" font-weight="400" fill="#16202E" text-anchor="middle">đo tải thực tế</text><polygon points="278,150 468,150 488,195 468,240 278,240 298,195" fill="#EEF3FA" stroke="#1E4B8F" stroke-width="2"/><text x="383" y="190" font-size="15" font-weight="700" fill="#1E4B8F" text-anchor="middle">2. Phân loại tải</text><text x="383" y="212" font-size="15" font-weight="400" fill="#16202E" text-anchor="middle">theo mức gián đoạn</text><polygon points="496,150 686,150 706,195 686,240 496,240 516,195" fill="#EEF3FA" stroke="#1E4B8F" stroke-width="2"/><text x="601" y="190" font-size="15" font-weight="700" fill="#1E4B8F" text-anchor="middle">3. Chọn phương án</text><text x="601" y="212" font-size="15" font-weight="400" fill="#16202E" text-anchor="middle">chuyển tải</text><polygon points="714,150 904,150 924,195 904,240 714,240 734,195" fill="#EEF3FA" stroke="#1E4B8F" stroke-width="2"/><text x="819" y="190" font-size="15" font-weight="700" fill="#1E4B8F" text-anchor="