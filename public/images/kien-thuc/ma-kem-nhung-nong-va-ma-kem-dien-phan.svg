<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" font-family="Inter, 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif"><title>Chọn lớp phủ thang máng cáp theo cấp ăn mòn</title><rect x="0" y="0" width="1200" height="630" rx="0" fill="#fff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="12" height="630" rx="0" fill="#1E4B8F" stroke="none" stroke-width="2"/><text x="60" y="72" font-size="34" font-weight="700" fill="#16202E" text-anchor="start">Chọn lớp phủ thang máng cáp theo cấp ăn mòn</text><text x="60" y="108" font-size="19" font-weight="400" fill="#5B6675" text-anchor="start">Từ trong nhà khô (C1) tới ven biển, hóa chất (C5, CX)</text><line x1="60" y1="128" x2="1140" y2="128" stroke="#E2E8F0" stroke-width="2"/><text x="60" y="160" font-size="14" font-weight="600" fill="#5B6675" text-anchor="start">Cấp ăn mòn</text><text x="250" y="160" font-size="14" font-weight="600" fill="#5B6675" text-anchor="start">Môi trường điển hình</text><text x="600" y="160" font-size="14" font-weight="600" fill="#5B6675" text-anchor="start">Kẽm ăn mòn (µm/năm)</text><text x="800" y="160" font-size="14" font-weight="600" fill="#5B6675" text-anchor="start">Lớp phủ khuyến nghị</text><rect x="60" y="172" width="1080" height="50" rx="6" fill="#EEF3FA" stroke="#D5DEEA" stroke-width="1"/><rect x="60" y="172" width="58" height="50" rx="6" fill="#1F7A4D" stroke="none" stroke-width="0"/><text x="89" y="204" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">C1</text><text x="132" y="203" font-size="16" font-weight="600" fill="#16202E" text-anchor="start">Rất thấp</text><text x="250" y="203" font-size="16" font-weight="400" fill="#16202E" text-anchor="start">Trong nhà có điều hòa, khô</text><text x="600" y="203" font-size="16" font-weight="600" fill="#16202E" text-anchor="start">≤ 0,1</text><text x="800" y="203" font-size="16" font-weight="700" fill="#1E4B8F" text-anchor="start">Điện phân / Z275 / sơn tĩnh điện</text><rect x="60" y="230" width="1080" height="50" rx="6" fill="#fff" stroke="#D5DEEA" stroke-width="1"/><rect x="60" y="230" width="58" height="50" rx="6" fill="#4C9A5F" stroke="none" stroke-width="0"/><text x="89" y="262" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">C2</text><text x="132" y="261" font-size="16" font-weight="600" fill="#16202E" text-anchor="start">Thấp</text><text x="250" y="261" font-size="16" font-weight="400" fill="#16202E" text-anchor="start">Kho, xưởng khô không điều hòa</text><text x="600" y="261" font-size="16" font-weight="600" fill="#16202E" text-anchor="start">0,1–0,7</text><text x="800" y="261" font-size="16" font-weight="700" fill="#1E4B8F" text-anchor="start">Z275 / sơn tĩnh điện (trong nhà)</text><rect x="60" y="288" width="1080" height="50" rx="6" fill="#EEF3FA" stroke="#D5DEEA" stroke-width="1"/><rect x="60" y="288" width="58" height="50" rx="6" fill="#C99212" stroke="none" stroke-width="0"/><text x="89" y="320" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">C3</text><text x="132" y="319" font-size="16" font-weight="600" fill="#16202E" text-anchor="start">Trung bình</text><text x="250" y="319" font-size="16" font-weight="400" fill="#16202E" text-anchor="start">Xưởng ẩm, ngoài trời đô thị</text><text x="600" y="319" font-size="16" font-weight="600" fill="#16202E" text-anchor="start">0,7–2,1</text><text x="800" y="319" font-size="16" font-weight="700" fill="#1E4B8F" text-anchor="start">Mạ kẽm nhúng nóng (HDG)</text><rect x="60" y="346" width="1080" height="50" rx="6" fill="#fff" stroke="#D5DEEA" stroke-width="1"/><rect x="60" y="346" width="58" height="50" rx="6" fill="#D9822B" stroke="none" stroke-width="0"/><text x="89" y="378" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">C4</text><text x="132" y="377" font-size="16" font-weight="600" fill="#16202E" text-anchor="start">Cao</text><text x="250" y="377" font-size="16" font-weight="400" fill="#16202E" text-anchor="start">Hóa chất, hồ bơi, ven biển vừa</text><text x="600" y="377" font-size="16" font-weight="600" fill="#16202E" text-anchor="start">2,1–4,2</text><text x="800" y="377" font-size="16" font-weight="700" fill="#1E4B8F" text-anchor="start">HDG, cân nhắc HDG + sơn</text><rect x="60" y="404" width="1080" height="50" rx="6" fill="#EEF3FA" stroke="#D5DEEA" stroke-width="1"/><rect x="60" y="404" width="58" height="50" rx="6" fill="#C0392B" stroke="none" stroke-width="0"/><text x="89" y="436" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">C5</text><text x="132" y="435" font-size="16" font-weight="600" fill="#16202E" text-anchor="start">Rất cao</text><text x="250" y="435" font-size="16" font-weight="400" fill="#16202E" text-anchor="start">Ven biển sát bờ, ngưng tụ liên tục</text><text x="600" y="435" font-size="16" font-weight="600" fill="#16202E" text-anchor="start">4,2–8,4</text><text x="800" y="435" font-size="16" font-weight="700" fill="#8E2A1F" text-anchor="start">HDG + sơn (duplex) / inox 316</text><rect x="60" y="462" width="1080" height="50" rx="6" fill="#fff" stroke="#D5DEEA" stroke-width="1"/><rect x="60" y="462" width="58" height="50" rx="6" fill="#7B1E1E" stroke="none" stroke-width="0"/><text x="89" y="494" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">CX</text><text x="132" y="493" font-size="16" font-weight="600" fill="#16202E" text-anchor="start">Cực cao</text><text x="250" y="493" font-size="16" font-weight="400" fill="#16202E" text-anchor="start">Ngoài khơi, hóa chất cực mạnh</text><text x="600" y="493" font-size="16" font-weight="600" fill="#16202E" text-anchor="start">8,4–25</text><text x="800" y="493" font-size="16" font-weight="700" fill="#8E2A1F" text-anchor="start">Inox 316L / composite FRP</text><text x="60" y="562" font-size="17" font-weight="400" fill="#5B6675" text-anchor="start">Tuổi thọ ước tính ≈ độ dày lớp mạ ÷ tốc độ ăn mòn kẽm. Theo ISO 9223, ISO 1461.</text><text x="1140" y="615" font-size="15" font-weight="600" fill="#1E4B8F" text-anchor="end">tudienptc.vn · PTC Switchboard</text></svg>