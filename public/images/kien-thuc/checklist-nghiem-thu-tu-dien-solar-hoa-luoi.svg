<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" font-family="Inter, 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif"><title>Checklist nghiệm thu tủ điện solar hòa lưới</title><rect x="0" y="0" width="1200" height="630" rx="0" fill="#fff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="12" height="630" rx="0" fill="#1E4B8F" stroke="none" stroke-width="2"/><text x="60" y="72" font-size="34" font-weight="700" fill="#16202E" text-anchor="start">Checklist nghiệm thu tủ điện solar hòa lưới</text><text x="60" y="108" font-size="19" font-weight="400" fill="#5B6675" text-anchor="start">4 bước: tại xưởng, tại hiện trường, thử hòa lưới, hồ sơ đấu nối</text><line x1="60" y1="128" x2="1140" y2="128" stroke="#E2E8F0" stroke-width="2"/><rect x="60" y="160" width="240" height="300" rx="10" fill="#EEF3FA" stroke="#1E4B8F" stroke-width="2"/><circle cx="94" cy="200" r="13" fill="#E8A317"/><text x="94" y="205" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="118" y="207" font-size="22" font-weight="700" fill="#1E4B8F" text-anchor="start">FAT tại xưởng</text><path d="M84 256 l7 7 l13 -14" fill="none" stroke="#1F7A4D" stroke-width="4"/><text x="114" y="262" font-size="16" font-weight="500" fill="#16202E" text-anchor="start">Định mức DC thiết bị</text><path d="M84 318 l7 7 l13 -14" fill="none" stroke="#1F7A4D" stroke-width="4"/><text x="114" y="324" font-size="16" font-weight="500" fill="#16202E" text-anchor="start">Fuse, SPD, cực tính</text><path d="M84 380 l7 7 l13 -14" fill="none" stroke="#1F7A4D" stroke-width="4"/><text x="114" y="386" font-size="16" font-weight="500" fill="#16202E" text-anchor="start">Routine Test IEC 61439</text><path d="M304 310 l26 0 m-10 -9 l10 9 l-10 9" fill="none" stroke="#E8A317" stroke-width="4"/><rect x="335" y="160" width="240" height="300" rx="10" fill="#fff" stroke="#1E4B8F" stroke-width="2"/><circle cx="369" cy="200" r="13" fill="#E8A317"/><text x="36