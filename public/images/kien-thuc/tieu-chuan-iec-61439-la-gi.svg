<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" font-family="Inter, 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif"><title>IEC 61439: Design Verification và Routine Test</title><rect x="0" y="0" width="1200" height="630" rx="0" fill="#fff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="12" height="630" rx="0" fill="#1E4B8F" stroke="none" stroke-width="2"/><text x="60" y="72" font-size="34" font-weight="700" fill="#16202E" text-anchor="start">IEC 61439: Design Verification và Routine Test</text><text x="60" y="108" font-size="19" font-weight="400" fill="#5B6675" text-anchor="start">Hai lớp kiểm chứng bắt buộc của tủ điện hạ thế và hồ sơ bàn giao</text><line x1="60" y1="128" x2="1140" y2="128" stroke="#E2E8F0" stroke-width="2"/><rect x="60" y="150" width="520" height="290" rx="12" fill="#F8FAFC" stroke="#1E4B8F" stroke-width="2"/><rect x="60" y="150" width="520" height="56" rx="12" fill="#1E4B8F" stroke="none" stroke-width="0"/><rect x="60" y="180" width="520" height="26" rx="0" fill="#1E4B8F" stroke="none" stroke-width="2"/><text x="320" y="186" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Design Verification (Type Test)</text><text x="84" y="240" font-size="18" font-weight="700" fill="#16202E" text-anchor="start">Kiểm chứng 1 lần cho mỗi thiết kế hệ tủ</text><text x="84" y="270" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">13 đặc tính theo Mục 10 IEC 61439-1</text><text x="84" y="300" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">Bằng thử nghiệm, tính toán so sánh</text><text x="84" y="330" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">hoặc đánh giá theo quy tắc thiết kế</text><text x="84" y="374" font-size="16" font-weight="400" fill="#5B6675" text-anchor="start">Ví dụ: độ tăng nhiệt, chịu ngắn mạch,</text><text x="84" y="398" font-size="16" font-weight="400" fill="#5B6675" text-anchor="start">điện môi, cấp IP, khoảng cách cách điện</text><rect x="620" y="150" width="520" height="290" rx="12" fill="#F8FAFC" stroke="#1F7A4D" stroke-width="2"/><rect x="620" y="150" width="520" height="56" rx="12" fill="#1F7A4D" stroke="none" stroke-width="0"/><rect x="620" y="180" width="520" height="26" rx="0" fill="#1F7A4D" stroke="none" stroke-width="2"/><text x="880" y="186" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Routine Verification (Routine Test)</text><text x="644" y="240" font-size="18" font-weight="700" fill="#16202E" text-anchor="start">Kiểm tra 100% từng tủ trước xuất xưởng</text><text x="644" y="270" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">10 hạng mục theo Mục 11 IEC 61439-1</text><text x="644" y="300" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">Nhà sản xuất tủ thực hiện, có biên bản</text><text x="644" y="330" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">riêng cho từng tủ</text><text x="644" y="374" font-size="16" font-weight="400" fill="#5B6675" text-anchor="start">Ví dụ: cấp IP, mạch bảo vệ, siết mối nối,</text><text x="644" y="398" font-size="16" font-weight="400" fill="#5B6675" text-anchor="start">đi dây, vận hành cơ khí, điện môi, nhãn tủ</text><line x1="320" y1="440" x2="320" y2="478" stroke="#16202E" stroke-width="3"/><polygon points="312,476 328,476 320,490" fill="#16202E"/><line x1="880" y1="440" x2="880" y2="478" stroke="#16202E" stroke-width="3"/><polygon points="872,476 888,476 880,490" fill="#16202E"/><rect x="60" y="492" width="1080" height="88" rx="12" fill="#EEF3FA" stroke="#1E4B8F" stroke-width="2"/><text x="600" y="527" font-size="20" font-weight="700" fill="#1E4B8F" text-anchor="middle">Bộ hồ sơ hoàn công bàn giao chủ đầu tư</text><text x="600" y="559" font-size="16" font-weight="400" fill="#16202E" text-anchor="middle">Biên bản Routine Test · Bằng chứng Design Verification · Bản vẽ As-built · CO/CQ thiết bị</text><text x="1140" y="615" font-size="15" font-weight="600" fill="#1E4B8F" text-anchor="end">tudienptc.vn · PTC Switchboard</text></svg>