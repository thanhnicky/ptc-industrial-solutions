<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" font-family="Inter, 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif"><title>So sánh cấp bảo vệ IP cho tủ điện</title><rect x="0" y="0" width="1200" height="630" rx="0" fill="#fff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="12" height="630" rx="0" fill="#1E4B8F" stroke="none" stroke-width="2"/><text x="60" y="72" font-size="34" font-weight="700" fill="#16202E" text-anchor="start">So sánh cấp bảo vệ IP cho tủ điện</text><text x="60" y="108" font-size="19" font-weight="400" fill="#5B6675" text-anchor="start">IP31 · IP42 · IP54 trong nhà, IP55/IP65 cho khu rửa và ngoài trời</text><line x1="60" y1="128" x2="1140" y2="128" stroke="#E2E8F0" stroke-width="2"/><rect x="60" y="150" width="255" height="330" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/><rect x="60" y="150" width="255" height="76" rx="10" fill="#1E4B8F" stroke="none" stroke-width="0"/><rect x="60" y="200" width="255" height="26" rx="0" fill="#1E4B8F" stroke="none" stroke-width="2"/><text x="187.5" y="203" font-size="36" font-weight="700" fill="#fff" text-anchor="middle">IP31</text><text x="80" y="262" font-size="14" font-weight="600" fill="#5B6675" text-anchor="start">Chữ số 1 – vật rắn, bụi</text><text x="80" y="288" font-size="17" font-weight="600" fill="#16202E" text-anchor="start">Vật ≥ 2,5 mm</text><text x="80" y="328" font-size="14" font-weight="600" fill="#5B6675" text-anchor="start">Chữ số 2 – nước</text><text x="80" y="354" font-size="17" font-weight="600" fill="#16202E" text-anchor="start">Nước nhỏ giọt thẳng đứng</text><text x="80" y="396" font-size="14" font-weight="600" fill="#5B6675" text-anchor="start">Dùng cho</text><text x="80" y="422" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">Phòng điện khô, sạch,</text><text x="80" y="446" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">có điều hòa</text><rect x="335" y="150" width="255" height="330" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/><rect x="335" y="150" width="255" height="76" rx="10" fill="#1E4B8F" stroke="none" stroke-width="0"/><rect x="335" y="200" width="255" height="26" rx="0" fill="#1E4B8F" stroke="none" stroke-width="2"/><text x="462.5" y="203" font-size="36" font-weight="700" fill="#fff" text-anchor="middle">IP42</text><text x="355" y="262" font-size="14" font-weight="600" fill="#5B6675" text-anchor="start">Chữ số 1 – vật rắn, bụi</text><text x="355" y="288" font-size="17" font-weight="600" fill="#16202E" text-anchor="start">Vật ≥ 1 mm</text><text x="355" y="328" font-size="14" font-weight="600" fill="#5B6675" text-anchor="start">Chữ số 2 – nước</text><text x="355" y="354" font-size="17" font-weight="600" fill="#16202E" text-anchor="start">Nhỏ giọt khi nghiêng 15°</text><text x="355" y="396" font-size="14" font-weight="600" fill="#5B6675" text-anchor="start">Dùng cho</text><text x="355" y="422" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">Phòng kỹ thuật,</text><text x="355" y="446" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">xưởng lắp ráp ít bụi</text><rect x="610" y="150" width="255" height="330" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/><rect x="610" y="150" width="255" height="76" rx="10" fill="#1E4B8F" stroke="none" stroke-width="0"/><rect x="610" y="200" width="255" height="26" rx="0" fill="#1E4B8F" stroke="none" stroke-width="2"/><text x="737.5" y="203" font-size="36" font-weight="700" fill="#fff" text-anchor="middle">IP54</text><text x="630" y="262" font-size="14" font-weight="600" fill="#5B6675" text-anchor="start">Chữ số 1 – vật rắn, bụi</text><text x="630" y="288" font-size="17" font-weight="600" fill="#16202E" text-anchor="start">Chống bụi (hạn chế lọt)</text><text x="630" y="328" font-size="14" font-weight="600" fill="#5B6675" text-anchor="start">Chữ số 2 – nước</text><text x="630" y="354" font-size="17" font-weight="600" fill="#16202E" text-anchor="start">Nước bắn tóe mọi hướng</text><text x="630" y="396" font-size="14" font-weight="600" fill="#5B6675" text-anchor="start">Dùng cho</text><text x="630" y="422" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">Xưởng ẩm, nhiều bụi:</text><text x="630" y="446" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">thực phẩm, dệt, gỗ</text><rect x="885" y="150" width="255" height="330" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/><rect x="885" y="150" width="255" height="76" rx="10" fill="#0F2E5C" stroke="none" stroke-width="0"/><rect x="885" y="200" width="255" height="26" rx="0" fill="#0F2E5C" stroke="none" stroke-width="2"/><text x="1012.5" y="203" font-size="36" font-weight="700" fill="#fff" text-anchor="middle">IP55 / IP65</text><text x="905" y="262" font-size="14" font-weight="600" fill="#5B6675" text-anchor="start">Chữ số 1 – vật rắn, bụi</text><text x="905" y="288" font-size="17" font-weight="600" fill="#16202E" text-anchor="start">Chống bụi / kín bụi</text><text x="905" y="328" font-size="14" font-weight="600" fill="#5B6675" text-anchor="start">Chữ số 2 – nước</text><text x="905" y="354" font-size="17" font-weight="600" fill="#16202E" text-anchor="start">Tia nước từ vòi mọi hướng</text><text x="905" y="396" font-size="14" font-weight="600" fill="#5B6675" text-anchor="start">Dùng cho</text><text x="905" y="422" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">Khu rửa bằng vòi,</text><text x="905" y="446" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">ngoài trời</text><rect x="60" y="500" width="1080" height="52" rx="8" fill="#FFF7E6" stroke="#E8A317" stroke-width="2"/><text x="600" y="533" font-size="17" font-weight="600" fill="#16202E" text-anchor="middle">Cấp IP càng cao, tủ càng khó tản nhiệt · IP không thay thế IK (chống va đập)</text><text x="1140" y="615" font-size="15" font-weight="600" fill="#1E4B8F" text-anchor="end">tudienptc.vn · PTC Switchboard</text></svg>